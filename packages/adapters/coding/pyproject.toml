[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "forecontract-coding"
version = "0.1.0"
description = "ForeContract Coding distribution: strict Windows Coding contracts, guarded workspace I/O, Job-Object process control, CodingAdapter and native Core+LLM assembly."
requires-python = ">=3.12"
dependencies = [
    "forecontract-core>=0.1,<0.2",
    "forecontract-llm>=0.1,<0.2",
    "pydantic>=2,<3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
