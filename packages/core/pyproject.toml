[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "forecontract-core"
version = "0.1.0"
description = "ForeContract core distribution: versioned models, protocols, Contract Builder, sequential Runtime and generic criteria/Recovery seams."
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
